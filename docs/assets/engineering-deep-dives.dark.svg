<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" style="font-family:Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
  <title>K-Stock Engine 3대 핵심 문제 해결 사례</title>
  <desc>미래참조 차단과 정수 회계 원장, 호스트 공유 호출 제어, 5-슬리브 북과 블록 부트스트랩 파산 가드</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" data-paint-static="true"/></filter></defs>
  <rect width="1200" height="850" fill="#16191E" data-fill-role="canvas"/>
  <rect x="48" y="44" width="6" height="64" rx="3" fill="#6FA3D3" data-fill-role="focus"/>
  <text x="70" y="50" font-size="13.5" font-weight="700" fill="#D5DADF" data-fill-role="ink" text-anchor="start" dominant-baseline="central" letter-spacing="0.08em">ENGINEERING DEEP DIVES</text>
  <text x="70" y="78" font-size="28" font-weight="700" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">장애를 탐지하고, 조치하고, 무결성으로 검증한 3가지 사례</text>
  <text x="70" y="108" font-size="15" font-weight="600" fill="#D5DADF" data-fill-role="ink" text-anchor="start" dominant-baseline="central">문제 상황 → 탐지 · 조치 · 검증 → 코드와 테스트로 확인되는 수치</text>
  <rect x="48" y="140" width="1104" height="210" rx="16" fill="#20242B" data-fill-role="surface" stroke="#6FA3D3" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="72" y="158" width="169" height="28" rx="14" fill="#2A3746" stroke="#6FA3D3" stroke-width="1" data-fill-role="blue-fill" data-stroke-role="blue-line"/>
  <text x="156.5" y="172.0" font-size="12.5" font-weight="700" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CASE 01 · 문제 상황</text>
  <text x="72" y="206" font-size="20" font-weight="700" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">미래참조 차단 &amp; 정수 회계</text>
  <text x="72" y="236" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">분기 실적 소급 적용으로 인한</text>
  <text x="72" y="257" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">미래 정보 누출과 float 부동소수점</text>
  <text x="72" y="278" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">오차 누적으로 실전 주문 시 잔고</text>
  <text x="72" y="299" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">불일치 및 T+2 미수금 사고가</text>
  <text x="72" y="320" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">발생할 수 있었습니다.</text>
  <rect x="376" y="164" width="170" height="162" rx="12" fill="#2A3746" data-fill-role="blue-fill" stroke="#6FA3D3" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="390" y="190" font-size="16.5" font-weight="700" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">① 탐지</text>
  <text x="390" y="228" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">DART 접수시각</text>
  <text x="390" y="254" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">기준 PIT 격리</text>
  <text x="390" y="280" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">45일 누출 봉쇄</text>
  <path d="M552.0 237.0 L560.0 245.0 L552.0 253.0" fill="none" stroke="#6FA3D3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="blue-line"/>
  <rect x="566" y="164" width="170" height="162" rx="12" fill="#2A3746" data-fill-role="blue-fill" stroke="#6FA3D3" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="580" y="190" font-size="16.5" font-weight="700" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">② 조치</text>
  <text x="580" y="228" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">전 계좌 원 단위</text>
  <text x="580" y="254" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">정수 회계 원장 구축</text>
  <text x="580" y="280" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">매도 선체결 보장</text>
  <path d="M742.0 237.0 L750.0 245.0 L742.0 253.0" fill="none" stroke="#6FA3D3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="blue-line"/>
  <rect x="756" y="164" width="170" height="162" rx="12" fill="#2A3746" data-fill-role="blue-fill" stroke="#6FA3D3" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="770" y="190" font-size="16.5" font-weight="700" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">③ 무결성 검증</text>
  <text x="770" y="228" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">부동소수점 오차 0원</text>
  <text x="770" y="254" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">미수금 0건 불변식을</text>
  <text x="770" y="280" font-size="15" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">테스트로 강제</text>
  <rect x="950" y="164" width="178" height="70" rx="12" fill="#2A3746" data-fill-role="blue-fill" stroke="#6FA3D3" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="188" font-size="27" font-weight="700" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">0.00%</text>
  <text x="1039.0" y="218" font-size="14.5" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">미래 정보 참조율</text>
  <rect x="950" y="246" width="178" height="70" rx="12" fill="#2A3746" data-fill-role="blue-fill" stroke="#6FA3D3" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="270" font-size="27" font-weight="700" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">0원</text>
  <text x="1039.0" y="300" font-size="14.5" font-weight="600" fill="#D3E5F5" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">부동소수점 오차</text>
  <rect x="48" y="372" width="1104" height="210" rx="16" fill="#20242B" data-fill-role="surface" stroke="#5FAE8F" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="72" y="390" width="169" height="28" rx="14" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="green-fill" data-stroke-role="green-line"/>
  <text x="156.5" y="404.0" font-size="12.5" font-weight="700" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CASE 02 · 문제 상황</text>
  <text x="72" y="438" font-size="20" font-weight="700" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">호스트 공유 호출 제어</text>
  <text x="72" y="468" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">한 서버의 여러 프로젝트가 같은</text>
  <text x="72" y="489" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">증권사 키를 쓰는데, 프로세스별</text>
  <text x="72" y="510" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">리미터는 서로를 보지 못해 합산</text>
  <text x="72" y="531" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">호출이 한도를 넘고 토큰도 중복</text>
  <text x="72" y="552" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">발급되는 문제가 있었습니다.</text>
  <rect x="376" y="396" width="170" height="162" rx="12" fill="#263A37" data-fill-role="green-fill" stroke="#5FAE8F" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="390" y="422" font-size="16.5" font-weight="700" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">① 탐지</text>
  <text x="390" y="460" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">공유 마커 파일이</text>
  <text x="390" y="486" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">없으면 기동을</text>
  <text x="390" y="512" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">즉시 거부</text>
  <path d="M552.0 469.0 L560.0 477.0 L552.0 485.0" fill="none" stroke="#5FAE8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="green-line"/>
  <rect x="566" y="396" width="170" height="162" rx="12" fill="#263A37" data-fill-role="green-fill" stroke="#5FAE8F" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="580" y="422" font-size="16.5" font-weight="700" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">② 조치</text>
  <text x="580" y="460" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">flock 상태 파일에</text>
  <text x="580" y="486" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">18 req/s 간격으로</text>
  <text x="580" y="512" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">슬롯 예약</text>
  <path d="M742.0 469.0 L750.0 477.0 L742.0 485.0" fill="none" stroke="#5FAE8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="green-line"/>
  <rect x="756" y="396" width="170" height="162" rx="12" fill="#263A37" data-fill-role="green-fill" stroke="#5FAE8F" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="770" y="422" font-size="16.5" font-weight="700" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">③ 무결성 검증</text>
  <text x="770" y="460" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">두 프로세스가 같은</text>
  <text x="770" y="486" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">슬롯을 못 얻음을</text>
  <text x="770" y="512" font-size="15" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">테스트로 고정</text>
  <rect x="950" y="396" width="178" height="70" rx="12" fill="#263A37" data-fill-role="green-fill" stroke="#5FAE8F" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="420" font-size="27" font-weight="700" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">18 req/s</text>
  <text x="1039.0" y="450" font-size="14.5" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">호스트 풀 상한</text>
  <rect x="950" y="478" width="178" height="70" rx="12" fill="#263A37" data-fill-role="green-fill" stroke="#5FAE8F" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="502" font-size="27" font-weight="700" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">63건</text>
  <text x="1039.0" y="532" font-size="14.5" font-weight="600" fill="#CDEBDD" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">관련 테스트</text>
  <rect x="48" y="604" width="1104" height="210" rx="16" fill="#20242B" data-fill-role="surface" stroke="#CBA050" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="72" y="622" width="169" height="28" rx="14" fill="#3A3220" stroke="#CBA050" stroke-width="1" data-fill-role="amber-fill" data-stroke-role="amber-line"/>
  <text x="156.5" y="636.0" font-size="12.5" font-weight="700" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CASE 03 · 문제 상황</text>
  <text x="72" y="670" font-size="20" font-weight="700" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">5-슬리브 북 &amp; 파산 가드</text>
  <text x="72" y="700" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">단일 요일 리밸런싱은 위상 운</text>
  <text x="72" y="721" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">(Phase Luck)에 취약하며,</text>
  <text x="72" y="742" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">무한 반복 백테스트는 통계적</text>
  <text x="72" y="763" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">과적합(P-hacking)을 유발해</text>
  <text x="72" y="784" font-size="14.5" font-weight="600" fill="#F2F4F6" data-fill-role="ink" text-anchor="start" dominant-baseline="central">실전에서 붕괴될 위험이 큽니다.</text>
  <rect x="376" y="628" width="170" height="162" rx="12" fill="#3A3220" data-fill-role="amber-fill" stroke="#CBA050" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="390" y="654" font-size="16.5" font-weight="700" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">① 탐지</text>
  <text x="390" y="692" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">5개 위상 결합북으로</text>
  <text x="390" y="718" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">요일 운 제거 및</text>
  <text x="390" y="744" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">추세 오버레이 헤지</text>
  <path d="M552.0 701.0 L560.0 709.0 L552.0 717.0" fill="none" stroke="#CBA050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="amber-line"/>
  <rect x="566" y="628" width="170" height="162" rx="12" fill="#3A3220" data-fill-role="amber-fill" stroke="#CBA050" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="580" y="654" font-size="16.5" font-weight="700" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">② 조치</text>
  <text x="580" y="692" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">4천회 5년 블록</text>
  <text x="580" y="718" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">부트스트랩으로</text>
  <text x="580" y="744" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">하위 10% J 평가</text>
  <path d="M742.0 701.0 L750.0 709.0 L742.0 717.0" fill="none" stroke="#CBA050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="amber-line"/>
  <rect x="756" y="628" width="170" height="162" rx="12" fill="#3A3220" data-fill-role="amber-fill" stroke="#CBA050" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="770" y="654" font-size="16.5" font-weight="700" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">③ 무결성 검증</text>
  <text x="770" y="692" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">파산 가드 전수 통과</text>
  <text x="770" y="718" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">슬리피지 1.5틱까지</text>
  <text x="770" y="744" font-size="15" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">무한 저항력 검증</text>
  <rect x="950" y="628" width="178" height="70" rx="12" fill="#3A3220" data-fill-role="amber-fill" stroke="#CBA050" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="652" font-size="27" font-weight="700" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">4,000회</text>
  <text x="1039.0" y="682" font-size="14.5" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">블록 부트스트랩</text>
  <rect x="950" y="710" width="178" height="70" rx="12" fill="#3A3220" data-fill-role="amber-fill" stroke="#CBA050" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="734" font-size="27" font-weight="700" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">0.05%</text>
  <text x="1039.0" y="764" font-size="14.5" font-weight="600" fill="#F3E2B8" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">5년 파산 확률</text>
</svg>
