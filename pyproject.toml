[project]
name = "k-stock-engine"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.13.0",
    "tenacity>=8.5.0",
    "psutil>=6.0.0",
    "tqdm>=4.67.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "openpyxl>=3.1.0",
    "gspread>=6.0.0",
    "oauth2client>=4.1.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "pykrx>=1.0.0",
    "setuptools>=69.0.0,<82",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.1.0",
    "catboost>=1.2.0",
    "huggingface-hub>=1.26.0",
    "polars>=1.43.2",
    "numba>=0.66.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.backfill*"]




[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "data", 
    "legacy", 
    ".legacy",
    "scratch",
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv",
    "src/legacy",
    "src/utils",
    "config/base.py",
    "tools",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit (Security)
    "PERF", # Perflint (Performance)
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions (Performance/Readability)
    "PT",   # flake8-pytest-style (Testing)
    "SIM",  # flake8-simplify (Readability)
    "TID",  # flake8-tidy-imports
    "ASYNC", # flake8-async
    "T20",  # flake8-print (Ensures no print statements are used, enforcing logger)
    "ARG",  # flake8-unused-arguments (Prevents unused variables/arguments cluttering context)
]
ignore = [
    "S101",   # Allow assert (essential for pytest and invariant checking)
    "E741",   # Allow ambiguous variable names like 'l', 'O', 'I' (often used in math/quant formulas)
    "E501",   # Ignore line length violations (leave it to formatters and prevent AI retry loops)
    "ARG001", # Allow unused function arguments (important for standard signatures / overrides)
    "ARG002", # Allow unused method arguments (important for standard subclasses / interfaces)
    "ARG004", # Allow unused static method arguments
    "ARG005", # Allow unused lambda arguments
    "RUF100", # Allow unused noqa directives (prevents errors when globally ignoring rules like E501)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E402", "N803", "N806", "N813", "N814", "ARG", "I001", "RUF059", "F841"]
"src/execution/*" = ["T20", "ASYNC230", "ASYNC240", "S110", "SIM108", "B006"]
"src/legacy/*" = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
# AI에게 엄격한 Type Hinting 강제
strict = true
explicit_package_bases = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "data", 
    "legacy", 
    ".legacy",
    "scratch",
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv",
    "^tests/.*/conftest\\.py$",
]

[[tool.mypy.overrides]]
module = ["src.legacy.*", "tests.*"]
ignore_errors = true




[tool.pyright]
exclude = [
    "data", 
    "legacy", 
    ".legacy",
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv"
]

[tool.uv]
# Keep uv's transient cache inside the workspace.  Some managed runners mount
# /home/kth/.cache read-only, which otherwise makes every `uv run` fail before
# Python starts.
cache-dir = "scratch/uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --import-mode=importlib"
pythonpath = ["."]
markers = [
    "slow: tests that read real parquet files (~0.3s each)",
]
filterwarnings = [
    "ignore::RuntimeWarning:numpy.*",
    "ignore::RuntimeWarning:scipy.*",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
