[policy]
family = "ml_sleeve_hedge"
n = 20  # compound-growth choice, centre of the N 8-12 plateau
keep_rank_multiple = 3.0
rebalance_every_sessions = 5
trend_min_ret21 = 0.0            # dev_ma20 leg intentionally omitted (disabled)
trend_fail_weight_fraction = 0.85  # failed trend names keep this fraction of their 1/n slot
min_units_per_slot = 3

[policy.universe]
min_adtv20_krw = 500000000
min_price_krw = 1000

[scorer]                          # frozen, identical to the previous strategy file
feature_set = "dedup52"  # probe 2026-10-08: rank-corr >= 0.80 duplicates removed (62 -> 52)
horizons = [5, 10, 21]
num_boost_round = 300
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 800
feature_fraction = 0.7
bagging_fraction = 0.7
bagging_freq = 1
lambda_l2 = 50.0
seed = 11
num_threads = 8
min_cross_section = 50
winsor_low_pct = 1.0
winsor_high_pct = 99.0
purge_extra_sessions = 2
min_train_rows = 20000
first_test_year = 2018

[book]
sleeves = 5
stock_capital_fraction = 0.75
rebalance_band = 0.5

[hedge]
hedge_ratio = 0.0
beta_window_sessions = 120
beta_min_sessions = 40
beta_cap = 2.0
rebalance_every_sessions = 5
use_futures = true
contract_multiplier_krw = 10000  # KOSDAQ 150 futures
initial_margin_rate = 0.2175  # KRX KOSDAQ 150 futures 위탁증거금률, broker table as of 2026-10-06
margin_buffer_rate = 0.10
margin_topup_trigger_fraction = 0.75
futures_cost_rate = 0.0003
inverse_cost_rate = 0.0007
resize_sell_cost_rate = 0.0025
resize_buy_cost_rate = 0.0005
futures_tax_rate = 0.11
futures_annual_deduction_krw = 2500000  # must equal the trend leg: derivative tax is one aggregate
inverse_tax_rate = 0.154

[trend_overlay]
ma_sessions = 100
vol_cap = 0.25
vol_window_sessions = 60
long_fraction = 1.0
short_fraction = 0.5
rebalance_every_sessions = 1
contract_multiplier_krw = 50000  # mini KOSPI 200 futures
initial_margin_rate = 0.2175  # KRX mini KOSPI 200 futures 위탁증거금률 21.75% (유지 14.50%), broker table as of 2026-10-06
margin_buffer_rate = 0.10  # engine reserve above initial margin (policy, not a KRX rate)
margin_topup_trigger_fraction = 0.75
futures_cost_rate = 0.0003
futures_tax_rate = 0.11
futures_annual_deduction_krw = 2500000  # must equal the trend leg: derivative tax is one aggregate

[regime_hedge]
tsmom_horizons = [21, 63, 126, 252]
target_vol = 0.10
max_fraction = 1.5
vol_window_sessions = 60
rebalance_every_sessions = 1
contract_multiplier_krw = 10000  # KOSDAQ 150 futures
initial_margin_rate = 0.2175  # KRX KOSDAQ 150 futures 위탁증거금률, broker table as of 2026-10-06
margin_buffer_rate = 0.10
margin_topup_trigger_fraction = 0.75
futures_cost_rate = 0.0003
futures_tax_rate = 0.11
futures_annual_deduction_krw = 2500000  # must equal the trend leg: derivative tax is one aggregate
