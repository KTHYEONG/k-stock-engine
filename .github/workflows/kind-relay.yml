name: KIND relay producer

on:
  schedule:
    - cron: "10 8 * * *"
    - cron: "5 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kind-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Produce verified KIND bundle
        run: uv run python -m src.ops.kind_relay produce --out "$RUNNER_TEMP/kind-bundle.json"

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deliver bundle to VPS inbox
        env:
          SSH_KEY: ${{ secrets.SSH_OPS_KEY }}
          # or-vps SSH host key (public): pinned so a host impersonating the VPS on the tailnet is refused.
          VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII444atEBxL7GUKeZS0hpR6M2QvL5H3GeBPLhNO/fTNq
          HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          printf '* %s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts_vps
          SSH_OPTS="-i $HOME/.ssh/relay_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_vps -o ConnectTimeout=20"
          # The ops key is forced through ~/bin/ci-ops-gate (krx-alpha deploy/host/ci-ops-gate.sh), which writes stdin to the inbox atomically.
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" kse-kind-relay-put < "$RUNNER_TEMP/kind-bundle.json"
