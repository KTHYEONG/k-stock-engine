name: Oracle CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/kthyeong/k-stock-engine

jobs:
  # Decides whether this push reaches the running system. Tests/docs/markdown/AI-config-only pushes
  # still run the test job but skip build and deploy (no approval prompt).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Classify runtime impact
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          runtime=true
          if [ "$EVENT" = "push" ]; then
            set +e
            bash .github/scripts/runtime_changed.sh "$BEFORE" "$GITHUB_SHA"
            rc=$?
            set -e
            if [ "$rc" -eq 1 ]; then runtime=false; fi
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime"

      # An older run parked at the production approval gate would hold the deploy concurrency slot and
      # block this run. This push already contains those commits, so cancel only older runs still waiting.
      - name: Cancel older runs waiting for approval
        if: steps.classify.outputs.runtime == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh run list -R "$GITHUB_REPOSITORY" -w deploy.yml -s waiting -L 20 --json databaseId -q '.[].databaseId' |
          while read -r id; do
            if [ -n "$id" ] && [ "$id" -lt "$GITHUB_RUN_ID" ]; then
              echo "cancel stale waiting run $id"
              gh run cancel "$id" -R "$GITHUB_REPOSITORY" || echo "::warning::could not cancel run $id"
            fi
          done

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Run test suite (fail-closed deploy gate)
        run: uv run pytest

  build-and-push:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          build-args: KSE_CODE_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # The deploy SSH key lives only in the production environment: no owner approval, no key.
    environment: production
    needs: [changes, test, build-and-push]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # packages:write lets the runner move the registry :latest tag; the VPS GHCR_PAT stays read-only.
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-or-vps
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull latest image and converge host units on VPS over Tailscale
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # or-vps SSH host key (public): pinned so a host impersonating the VPS on the tailnet is refused.
          VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII444atEBxL7GUKeZS0hpR6M2QvL5H3GeBPLhNO/fTNq
          HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STAGE=runner_init
          trap 'rc=$?; echo "::error title=vps-deploy/k-stock-engine/${STAGE}::rc=${rc} line=${LINENO} side=runner"' ERR
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '* %s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts_vps
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_vps -o ConnectTimeout=20"
          # Superseded only when a newer main commit itself changes runtime paths; a newer tests/docs-only
          # push skips its own deploy, so this commit must still deploy (runtime_changed.sh exit 1).
          LATEST_MAIN_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)"
          test -n "$LATEST_MAIN_SHA"
          if [ "$COMMIT_SHA" != "$LATEST_MAIN_SHA" ]; then
            set +e
            bash .github/scripts/runtime_changed.sh "$COMMIT_SHA" "$LATEST_MAIN_SHA"
            newer_rc=$?
            set -e
            if [ "$newer_rc" -ne 0 ]; then LATEST_MAIN_SHA="$COMMIT_SHA"; fi
          fi

          STAGE=stage_lib
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/k-stock-engine/.deploy"
          scp $SSH_OPTS deploy/vps-deploy-lib.sh "$REMOTE_USER@$HOST:~/k-stock-engine/.deploy/vps-deploy-lib-$COMMIT_SHA.sh"
          scp $SSH_OPTS -r deploy "$REMOTE_USER@$HOST:~/k-stock-engine/.deploy/staging-$COMMIT_SHA"

          STAGE=remote
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" bash -s <<EOF
          set -e
          source ~/k-stock-engine/.deploy/vps-deploy-lib-$COMMIT_SHA.sh
          vps_deploy_init k-stock-engine $COMMIT_SHA
          vps_stage pull
          echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          vps_pull_verified ghcr.io/kthyeong/k-stock-engine $COMMIT_SHA
          vps_stage preflight
          vps_stage blackout_wait
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 -e TZ=Asia/Seoul ghcr.io/kthyeong/k-stock-engine:sha-$COMMIT_SHA uv run python -m src.ops.deploy_window --wait
          if [ "$LATEST_MAIN_SHA" != "$COMMIT_SHA" ]; then
            echo "SKIP: superseded by $LATEST_MAIN_SHA"
            rm -f ~/k-stock-engine/.deploy/vps-deploy-lib-$COMMIT_SHA.sh
            rm -rf ~/k-stock-engine/.deploy/staging-$COMMIT_SHA
            exit 0
          fi
          vps_stage promote
          vps_promote_latest ghcr.io/kthyeong/k-stock-engine $COMMIT_SHA
          vps_stage converge
          bash ~/k-stock-engine/.deploy/staging-$COMMIT_SHA/install_systemd.sh
          rm -f ~/k-stock-engine/.deploy/vps-deploy-lib-$COMMIT_SHA.sh
          # install_systemd.sh copies units and kse-run out of staging, so staging trees are disposable;
          # also reap trees left by earlier deploys (deploys are serialized by the deploy-or-vps group).
          rm -rf ~/k-stock-engine/.deploy/staging-$COMMIT_SHA
          find ~/k-stock-engine/.deploy -maxdepth 1 -type d -name 'staging-*' -mmin +60 -exec rm -rf {} +
          EOF

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote registry latest to the deployed revision
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Same supersede rule as the VPS step: only the newest runtime-changing main commit owns :latest.
          # Superseded only when a newer main commit itself changes runtime paths; a newer tests/docs-only
          # push skips its own deploy, so this commit must still deploy (runtime_changed.sh exit 1).
          LATEST_MAIN_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)"
          test -n "$LATEST_MAIN_SHA"
          if [ "$COMMIT_SHA" != "$LATEST_MAIN_SHA" ]; then
            set +e
            bash .github/scripts/runtime_changed.sh "$COMMIT_SHA" "$LATEST_MAIN_SHA"
            newer_rc=$?
            set -e
            if [ "$newer_rc" -ne 0 ]; then LATEST_MAIN_SHA="$COMMIT_SHA"; fi
          fi
          if [ "$LATEST_MAIN_SHA" != "$COMMIT_SHA" ]; then
            echo "SKIP: superseded by $LATEST_MAIN_SHA"
            exit 0
          fi
          docker buildx imagetools create -t ghcr.io/kthyeong/k-stock-engine:latest ghcr.io/kthyeong/k-stock-engine:sha-$COMMIT_SHA
