# Weekly dependency PRs. Security fixes arrive as soon as an advisory lands
# (repository Dependabot security updates). Merging any PR still goes through
# the production deploy approval.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "11:00"
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "11:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "11:00"
      timezone: Asia/Seoul
