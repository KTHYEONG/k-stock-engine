# Provider throughput and quota policy. Values moved exactly from the scope
# TOML [collection], the VPS POLICY, and the KIS pace used today; never retuned here.
[dart]
circuit_threshold = 3
requests_per_identity = 3
batch_identities = 500
# Aggregate pacing across every DART key process on this host (IP-level blocking is shared).
host_min_interval_seconds = 0.1
shared_ip_avoid_windows_kst = [["21:25", "21:50"]]
# Market-wide disclosure list types the DART jobs consume: periodic reports (A),
# profit-structure changes (I001), fair disclosures carrying preliminary results
# (I002), and the exchange market-action notices (I003: delisting, liquidation
# trading, administrative issues, trading halts).
disclosure_types = ["A", "I001", "I002", "I003"]
# Days a retained corp-code bridge stays fresh without a missing ticker.
corp_codes_max_age_days = 30

[dart.document_parser]
trusted = true
min_precision = 0.995
benchmark_sample = 300

# Primary key shared with other projects: conservative budget and reserve.
[dart.keys.OPENDART_API_KEY]
daily_limit = 20000
daily_budget = 16000
daily_reserve = 400
min_interval_seconds = 0.2
max_workers = 2

# Dedicated key with its own ledger. IP-level blocking is shared, so pacing matches.
# The unshared key is the default for job collection.
[dart.keys.OPENDART_API_KEY_2]
daily_limit = 20000
daily_budget = 19500
daily_reserve = 500
min_interval_seconds = 0.2
max_workers = 2
default = true

[dart.keys.OPENDART_API_KEY_3]
daily_limit = 20000
daily_budget = 19500
daily_reserve = 500
min_interval_seconds = 0.2
max_workers = 2

[dart.keys.OPENDART_API_KEY_4]
daily_limit = 20000
daily_budget = 19500
daily_reserve = 500
min_interval_seconds = 0.2
max_workers = 2

[kis]
app_key_env = "KIS_APP_KEY"
app_secret_env = "KIS_APP_SECRET"
account_no_env = "KIS_ACCOUNT_NO"
account_product_code_env = "KIS_ACCOUNT_PRODUCT_CODE"
env_env = "KIS_ENV"
circuit_threshold = 3
# Planning bound only: KIS publishes no daily cap for the FHPTJ04160001 TR.
daily_limit = 20000
# Rows one FHPTJ04160001 response returns; measured in the C3 page-size pilot.
investor_flow_rows_per_page = 30
# Per-symbol classification pace: 0.35 s lost ~10% to rate limits, 1.0 s succeeded fully.
min_interval_seconds = 1.0
# KisClient retry=2, i.e. three attempts total.
max_attempts = 3
# KIS business-level "try later" message codes (msg1 prefix match); anything else is terminal.
retryable_msg_codes = []
# Shared-pool data slot (or-vps KIS_DATA_<n> keys); unset disables pool admission.
pool_slot = 5
admission_class = "bulk"

[krx]
api_key_env = "KRX_OPENAPI_KEY"
circuit_threshold = 3
# Pacing verified against the KRX open API; the ledger owns the request quota
# (replacing the removed in-memory 10_000-request cap with the same bound).
min_interval_seconds = 1.5
daily_limit = 10000

[ls]
app_key_env = "LS_APP_KEY"
app_secret_env = "LS_APP_SECRET"
circuit_threshold = 3
max_sessions_per_request = 700
# Transport pacing governs LS throughput; the ledger meters the planning bound.
min_interval_seconds = 1.05
daily_limit = 10000
# LS business-level "try later" response codes (rsp_cd exact match); anything else is terminal.
retryable_rsp_codes = ["IGW00201"]

[dbsec]
app_key_env = "DB_APP_KEY"
app_secret_env = "DB_APP_SECRET"
circuit_threshold = 3
# Planning bound only: DB publishes no daily cap, measured/declared 2026-10-15.
daily_limit = 50000
# Vendor app-wide 20 TPS, measured/declared 2026-10-15.
app_min_interval_seconds = 0.05
# Vendor: charts 4 TPS, JCODES 3 TPS, measured/declared 2026-10-15.
scope_min_interval_seconds = { chart = 0.25, quote_master = 0.34 }
# Vendor token issuance 1 per minute, measured/declared 2026-10-15.
token_min_interval_seconds = 61.0
token_cache_dir_env = "DBSEC_TOKEN_CACHE_DIR"
# Vendor business-level "try later" response codes (rsp_cd exact match), measured/declared 2026-10-15.
retryable_rsp_codes = ["IGW00201", "IGW00001", "IGW00002", "IGW50011", "IGW50012"]
# Vendor auth response codes requiring a token refresh, measured/declared 2026-10-15.
auth_rsp_codes = ["IGW00121", "IGW00123"]
# DB intraday data for a session is final only after the 20:00 after-market close.
session_final_time_kst = "20:10"
# Newest DB-final sessions collected per run.
lookback_sessions = 5
# 1-minute J bars fetched per ticker; covers 20:00 back past 15:30 under extended hours.
closing_bar_count = 400
# Bronze units persisted per runner chunk.
chunk_units = 50
# JCODES divisions kept as equities; ETF/ETN/KONEX excluded.
equity_market_names = ["거래소", "코스닥"]
# A session's master snapshot may be taken until this time on the next session day.
master_valid_until_kst = "08:00"
# Shadow reconciliation of DB evidence against KRX daily-market Silver (report only).
reconcile_min_match_rate = 0.999
reconcile_min_coverage = 0.995
reconcile_ready_sessions = 20
reconcile_sample_limit = 20

[kind]
circuit_threshold = 3
# Public web service without a published rate policy: stay at one request per second.
min_interval_seconds = 1.0
daily_limit = 5000
# Title keywords covering delisting decisions, liquidation trading and administrative issues.
search_keywords = ["상장폐지", "정리매매", "관리종목"]
# Exchange forms whose bodies carry dates or the share class the title lacks.
document_titles = ["상장폐지", "관리종목지정", "관리종목지정해제"]
# Number of observed sessions KIND evidence may lag the decision horizon before market actions refuse to build.
max_stale_sessions = 5
relay_window_lookback_days = 14
relay_document_lookback_days = 14
relay_max_age_hours = 36
relay_clock_skew_seconds = 300
relay_attempts = 3

# Dividend decision plausibility gate. An implausible DPS is withheld, never repaired.
[dividends]
max_yield = 0.5
max_yield_ratio = 2.0
min_paid_share_fraction = 0.5
correction_window_days = 45

# Early earnings releases: a preliminary result is accepted only when its receipt falls within
# this many days after the labelled fiscal quarter end (corrections are exempt).
[earnings_releases]
max_filing_lag_days = 135
