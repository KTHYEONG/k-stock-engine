[trend_overlay]
ma_sessions = 100
long_fraction = 1.0
short_fraction = 0.5
rebalance_every_sessions = 1
contract_multiplier_krw = 50000  # mini KOSPI 200 futures
initial_margin_rate = 0.2175
margin_buffer_rate = 0.10  # conservative KQ150 baseline; replace both rates with the KRX-published mini KOSPI 200 margin before the challenge (a lower margin frees stock capital, so this baseline understates the candidate)
margin_topup_trigger_fraction = 0.75
futures_cost_rate = 0.0003
futures_tax_rate = 0.11
futures_annual_deduction_krw = 2500000
