# Research protocol: data-window guard, report-card policy and scenario definitions.
# Earliest session a run window may start (first month with trailing-four-quarter fundamentals for most
# issuers). Model training may still read earlier PIT cube rows; this bounds run windows only.
evaluation_start = "2017-04-01"
sessions_per_year = 252
primary_capital_krw = 100_000_000

[evaluation]
block_sessions = 63
draws = 4000
seed = 20261001
horizon_sessions = 1260
objective_quantile = 0.10
ruin_mdd_limit = -0.5
max_p_ruin = 1.0
max_p_growth_le_zero = 0.05
report_mdd_limits = [-0.3, -0.5]
recent_sessions = 252

[scenarios]
cost_grid_ticks = [0.0, 0.5, 1.0, 1.5]
stress_extra_slippage = 0.001
stress_hedge_extra_cost = 0.0005
stress_delay_sessions = 1
placebo_seed = 7
perturbation_cuts = 3
perturbation_seed = 7

[champion]
alpha = 0.05
require_neighbors = true
champion_seeds = [11, 12, 13]  # compare against the champion's 3-seed average, not its single draw (2026-10-09)
paired_horizon = "full"
multiplicity = "bonferroni_decisions"
# declared tolerance (user, 2026-10-07): at most 3%p/yr log-growth loss for a statistically shown tail-risk cut; never re-tuned after results
noninferiority_margin = 0.03
tail_quantile = 0.05
tail_block_sessions = 21
