# Research protocol v4: data-window guard, report-card policy and scenario definitions.
version = "research-protocol-v4"
# Earliest session a run window may start (first month with trailing-four-quarter fundamentals for most
# issuers). Model training may still read earlier PIT cube rows; this bounds run windows only.
evaluation_start = "2017-04-01"
sessions_per_year = 252
primary_capital_krw = 100_000_000

[evaluation]
block_sessions = 63
draws = 4000
seed = 20261001
horizon_sessions = 1260
objective_quantile = 0.10
ruin_mdd_limit = -0.5
max_p_ruin = 0.05
max_p_growth_le_zero = 0.05
report_mdd_limits = [-0.3, -0.5]
recent_sessions = 252

[scenarios]
cost_grid_ticks = [0.0, 0.5, 1.0, 1.5]
stress_extra_slippage = 0.001
stress_hedge_extra_cost = 0.0005
stress_delay_sessions = 1
placebo_seed = 7
perturbation_cuts = 3
perturbation_seed = 7

[champion]
alpha = 0.05
require_neighbors = true
